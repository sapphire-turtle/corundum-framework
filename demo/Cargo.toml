[package]
name = "corundum-framework-demo"
version = "0.0.0"
edition.workspace = true
description = "A demo of corundum-framework's shared pieces, to try them on each OS apart from the apps"
license.workspace = true
repository.workspace = true
publish = false

# One app for every OS. The lib holds it; each OS starts it its own way:
#
# - the desktops: the `corundum-framework-demo` binary (src/main.rs);
# - iOS: the staticlib, linked into the Xcode app in ios/ (`corundum_demo_main`);
# - Android: the cdylib, loaded by GameActivity in android/ (`android_main`).
[lib]
name = "corundum_demo"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "corundum-framework-demo"
path = "src/main.rs"

# The Velopack spike's stand-in for a service the package leaves running (src/velopack.rs).
[[bin]]
name = "corundum-framework-demo-daemon"
path = "src/bin/daemon.rs"
required-features = ["velopack"]

# The Windows console shim the package puts on `PATH` as `corundum-demo.exe`
# (demo-release.yml), so the GUI binary answers in a terminal.
[[bin]]
name = "corundum-framework-demo-console"
path = "src/bin/console.rs"
required-features = ["velopack"]

# The icon files `vpk pack --icon` takes, for the release workflow.
[[example]]
name = "icons"
path = "examples/icons.rs"

[dependencies]
tracing.workspace = true

[build-dependencies]
corundum-framework-build = { version = "0.4.0", path = "../crates/corundum-framework-build" }

# Everywhere but Android, the window is eframe's (`gui::window::run`); on Android it is
# GameActivity's (`gui::window::run_android`), and eframe's default does not build there.
#
# The demo turns on every OS feature its OS has an implementation of, so a build as it is
# tries all the OS has (the Platform and Media screens say which it has not); the apps
# around it (ios/, android/) declare what each needs (README.md has the list). Android has
# no media session yet.
[target.'cfg(not(target_os = "android"))'.dependencies]
corundum-framework = { path = "../crates/corundum-framework", features = ["eframe", "media-picker", "media-session", "qr-code", "qr-scan", "serde"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

# The updates panel replaces the running executable, which a phone's app never does (and its
# HTTP client's TLS does not build for them), so neither Android nor iOS turns it on. Nor
# `single-instance`: a phone runs its apps once by itself.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
corundum-framework = { path = "../crates/corundum-framework", features = ["gui-update", "single-instance"] }

# The Velopack page's daemon, stopped by its pid before an update (src/velopack.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# iOS shows a player in its now-playing only while the player's audio session plays sound:
# the Media screen's player plays silence through AVAudioPlayer while it plays.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.4"
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioPlayer"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSError", "NSString"] }

[target.'cfg(target_os = "android")'.dependencies]
corundum-framework = { path = "../crates/corundum-framework", features = ["android", "media-picker", "qr-code", "qr-scan", "serde"] }

[features]
# Built by the release workflow (demo-release.yml), not by `cargo run`: the demo as a
# Velopack package, with its updates, its command line, and the daemon its update stops
# (src/velopack.rs).
velopack = ["corundum-framework/gui-package", "corundum-framework/service"]
