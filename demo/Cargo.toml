[package]
name = "corundum-framework-demo"
version = "0.0.0"
edition.workspace = true
description = "A demo of corundum-framework's shared pieces, to try them on each OS apart from the apps"
license.workspace = true
repository.workspace = true
publish = false

# One app for every OS. The lib holds it; each OS starts it its own way:
#
# - the desktops: the `corundum-framework-demo` binary (src/main.rs);
# - iOS: the staticlib, linked into the Xcode app in ios/ (`corundum_demo_main`);
# - Android: the cdylib, loaded by GameActivity in android/ (`android_main`).
[lib]
name = "corundum_demo"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "corundum-framework-demo"
path = "src/main.rs"

# The Velopack spike's stand-in for a service the package leaves running (src/velopack.rs).
[[bin]]
name = "corundum-framework-demo-daemon"
path = "src/bin/daemon.rs"
required-features = ["velopack"]

# The icon files `vpk pack --icon` takes, for the release workflow.
[[example]]
name = "icons"
path = "examples/icons.rs"

[dependencies]
tracing.workspace = true

[build-dependencies]
corundum-framework-build = { version = "0.3.0", path = "../crates/corundum-framework-build" }

# Everywhere but Android, the window is eframe's (`gui::window::run`); on Android it is
# GameActivity's (`gui::window::run_android`), and eframe's default does not build there.
[target.'cfg(not(target_os = "android"))'.dependencies]
corundum-framework = { path = "../crates/corundum-framework", features = ["eframe", "serde"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

# The updates panel replaces the running executable, which a phone's app never does (and its
# HTTP client's TLS does not build for them), so neither Android nor iOS turns it on.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
corundum-framework = { path = "../crates/corundum-framework", features = ["gui-update"] }
# The Velopack spike (corundum-framework#51): the demo as an installed, updated package.
velopack = { version = "1.2.161", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
corundum-framework = { path = "../crates/corundum-framework", features = ["android", "serde"] }

[features]
# Built by the release workflow (demo-release.yml), not by `cargo run`: the demo as a
# Velopack package, with its Settings page and its daemon (src/velopack.rs).
velopack = ["dep:velopack"]
