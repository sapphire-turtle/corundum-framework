name: CI

on:
  pull_request:

jobs:
  ci:
    uses: sapphire-turtle/.github/.github/workflows/rust-ci.yml@v1
    with:
      # eframe's windowing needs these to build on Linux.
      linux-packages: libwayland-dev libxkbcommon-dev
      # The test job builds with --all-features; also build the gui crate without eframe,
      # as an app that renders egui on its own does, so the components never come to need
      # the window.
      post-test: |
        cargo clippy -p corundum-framework-gui --all-targets --no-default-features --locked -- -D warnings
        cargo clippy -p corundum-framework-gui --all-targets --no-default-features --features serde --locked -- -D warnings
        # The facade's default (no egui) and its gui alone (no eframe).
        cargo clippy -p corundum-framework --all-targets --locked -- -D warnings
        cargo clippy -p corundum-framework --all-targets --no-default-features --features gui,serde --locked -- -D warnings
        # The demo's binary links on each desktop (the tests link only its lib).
        cargo build -p corundum-framework-demo --bin corundum-framework-demo --locked
        # ... and as the Velopack package demo-release.yml packs: the GUI, the daemon, and
        # the console shim.
        cargo build -p corundum-framework-demo --features velopack --bins --locked
        # The configurations a store build compiles: no `self-update`.
        cargo clippy -p corundum-framework-gui --all-targets --no-default-features --features update --locked -- -D warnings
        cargo clippy -p corundum-framework-update --all-targets --no-default-features --locked -- -D warnings
        # Each of the system's screens (off by default) alone, so none comes to need another.
        for f in media-picker qr-scan; do
          cargo clippy -p corundum-framework-platform --all-targets --features $f --locked -- -D warnings || exit 1
        done
        for f in media-picker qr-scan qr-code; do
          cargo clippy -p corundum-framework-gui --all-targets --no-default-features --features $f --locked -- -D warnings || exit 1
        done
        # Without `qr-scan` an iOS app links no camera API (AVFoundation), which App Store
        # review would ask an NSCameraUsageDescription for.
        if cargo tree -p corundum-framework-gui --target aarch64-apple-ios -e normal --locked \
            --features media-picker,qr-code | grep -q objc2-av-foundation; then
          echo "AVFoundation is linked on iOS without qr-scan"; exit 1
        fi
        # The media session is off by default; on, alone and through the facade.
        cargo clippy -p corundum-framework-platform --all-targets --locked -- -D warnings
        cargo clippy -p corundum-framework-platform --all-targets --features media-session --locked -- -D warnings
        cargo clippy -p corundum-framework --all-targets --features media-session --locked -- -D warnings

  # Without `self-update` the update crate must not link `self-replace`: an app that only
  # looks releases up carries none of the replacement code.
  update-no-self-replace:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: self-replace is not linked without self-update
        run: |
          # Each tree goes to a file first, so a failing cargo fails the job rather than
          # passing as an empty tree.
          for args in \
            "-p corundum-framework-update --no-default-features" \
            "-p corundum-framework-gui --no-default-features --features update" \
            "-p corundum-framework --features gui-update"; do
            cargo tree --locked --target all $args -e normal > tree.txt
            # (`! grep` alone would not stop the loop under `set -e`.)
            if grep -q self-replace tree.txt; then
              echo "self-replace is linked for: $args"
              exit 1
            fi
          done

  # Velopack comes only with the package features: an app that updates a binary, or only
  # looks releases up, links none of it.
  velopack-only-for-package:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: velopack is linked with gui-package only
        run: |
          # Each tree goes to a file first, so a failing cargo fails the job rather than
          # passing as an empty tree.
          # The crate's own entry (`velopack v1.2.161`), not a path that has the word in it.
          cargo tree --locked --target all -p corundum-framework --features gui-update -e normal > tree.txt
          if grep -q ' velopack v' tree.txt; then
            echo "velopack is linked for --features gui-update"
            exit 1
          fi
          cargo tree --locked --target all -p corundum-framework --features gui-package -e normal > tree.txt
          if ! grep -q ' velopack v' tree.txt; then
            echo "velopack is not linked for --features gui-package"
            exit 1
          fi

  # The update crate, and the package crate, ask the platform crate for its directories and
  # `package` only: a headless user (a CLI, a server) must not build the SVG renderer.
  headless-without-resvg:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: resvg is not built for the update crate alone
        run: |
          for args in \
            "-p corundum-framework-update" \
            "-p corundum-framework-package" \
            "-p corundum-framework-platform --no-default-features"; do
            cargo tree --locked --target all $args -e normal > tree.txt
            if grep -q ' resvg v' tree.txt; then
              echo "resvg is built for: $args"
              exit 1
            fi
          done
          cargo tree --locked --target all -p corundum-framework-platform -e normal > tree.txt
          if ! grep -q ' resvg v' tree.txt; then
            echo "resvg is not built for the platform crate's default features"
            exit 1
          fi

  # Without `media-session` the platform crate, and the facade's default, must not build zbus
  # (or MediaPlayer): an app that plays nothing carries no D-Bus.
  media-session-off:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: zbus is not built without media-session
        run: |
          for args in \
            "-p corundum-framework-platform" \
            "-p corundum-framework"; do
            cargo tree --locked --target all $args -e normal > tree.txt
            if grep -qE '(zbus|objc2-media-player|objc2-avf-audio) v' tree.txt; then
              echo "the media session's dependencies are built for: $args"
              exit 1
            fi
          done
