name: Demo release

# The demo as a cargo-packager package (corundum-framework#103): pushing a tag
# `demo-v<version>`, where <version> is the demo's in demo/Cargo.toml, makes a pre-release
# and puts the demo's packages and its update feed on it (sapphire-turtle/.github's
# release-packager.yml), from which an installed demo updates itself
# (corundum-framework-package, through demo/src/package.rs).
#
# Secrets: PACKAGER_SIGN_PRIVATE_KEY and its password (the organization's) sign the
# packages, for the public key in demo/src/package.rs; the macOS package is signed and
# notarized with MACOS_CERTIFICATE and APPLE_API_KEY.
on:
  push:
    tags: ['demo-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The version the demo reports and the feed's must agree, or an installed demo would
      # update for ever.
      - name: Check the tag against the demo's version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("demo/Cargo.toml", "rb"))["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "demo-v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not demo-v$version, the demo's version"
            exit 1
          fi

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "corundum demo ${GITHUB_REF_NAME#demo-v}" \
            --notes "The demo packaged with cargo-packager, for corundum-framework#103. Not signed on Linux or Windows. Not for use."

  package:
    needs: release
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-packager.yml@v1
    # The signing key, and the macOS signing secrets.
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}
      package: corundum-framework-demo
      app-name: corundum-framework-demo
      features: package
      console-bin: corundum-framework-demo-console
      command: corundum-demo
      # The icons [package.metadata.packager] names, rendered from the demo's SVG.
      pre-package: cargo run --release --locked -p corundum-framework-demo --example icons -- "$CRATE_DIR/icons"
