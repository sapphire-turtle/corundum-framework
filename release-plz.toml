[workspace]
# The libraries go to crates.io in one version. Only the facade makes the `v{version}` tag
# and GitHub release, and writes CHANGELOG.md for all of them; the others make neither, as
# in sapphire-framework.
changelog_update = false
dependencies_update = true
publish = true
release = true
git_release_enable = false
git_tag_enable = false
# Publish only when a release PR is merged, not on every push to main that carries an
# unpublished version.
release_always = false
pr_branch_prefix = "release-plz/"
pr_labels = ["release"]

# They move together: the facade re-exports the platform, gui, update and package crates,
# the gui crate is built on the platform one, and the build crate is an app's
# build-dependency.
[[package]]
name = "corundum-framework-platform"
version_group = "corundum"

[[package]]
name = "corundum-framework-build"
version_group = "corundum"

[[package]]
name = "corundum-framework-gui"
version_group = "corundum"

[[package]]
name = "corundum-framework-update"
version_group = "corundum"

[[package]]
name = "corundum-framework-package"
version_group = "corundum"

[[package]]
name = "corundum-framework-keys"
version_group = "corundum"

# The tag, the GitHub release (its notes are the version's CHANGELOG section), and the one
# changelog at the root, with the other crates' commits in it.
[[package]]
name = "corundum-framework"
version_group = "corundum"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = [
  "corundum-framework-platform",
  "corundum-framework-gui",
  "corundum-framework-update",
  "corundum-framework-package",
  "corundum-framework-keys",
  "corundum-framework-build",
]
git_tag_enable = true
git_release_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# The demo app is not released: release-plz skips it for its `publish = false`. An entry
# here would set `publish = true` on it from the workspace's, and release-plz refuses that.
