[workspace]
# The libraries go to crates.io in one version. Only the facade makes the `v{version}` tag
# and GitHub release, and writes CHANGELOG.md for all three; the others make neither, as in
# sapphire-framework.
changelog_update = false
dependencies_update = true
publish = true
release = true
git_release_enable = false
git_tag_enable = false
# Publish only when a release PR is merged, not on every push to main that carries an
# unpublished version.
release_always = false
pr_branch_prefix = "release-plz/"
pr_labels = ["release"]

# The three move together: the facade re-exports the other two, and the gui crate is built
# on the platform one.
[[package]]
name = "corundum-framework-platform"
version_group = "corundum"

[[package]]
name = "corundum-framework-gui"
version_group = "corundum"

# The tag, the GitHub release (its notes are the version's CHANGELOG section), and the one
# changelog at the root, with the other two crates' commits in it.
[[package]]
name = "corundum-framework"
version_group = "corundum"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = ["corundum-framework-platform", "corundum-framework-gui"]
git_tag_enable = true
git_release_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# The demo app is not released (`publish = false`).
[[package]]
name = "corundum-framework-demo"
release = false
