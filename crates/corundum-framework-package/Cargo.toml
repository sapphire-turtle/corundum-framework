[package]
name = "corundum-framework-package"
# Versioned with the other corundum-framework crates (release-plz's `corundum` group).
version = "0.4.0"
edition.workspace = true
description = "A desktop app as a Velopack package: its start and install hooks, told apart from an update"
license = "MIT OR Apache-2.0"
repository.workspace = true
readme = "README.md"
keywords = ["velopack", "installer", "update", "package", "desktop"]
categories = ["os"]

# `test-support`: `Updater::for_tests`, an updater in a given state that never applies, for a
# GUI's tests.
[features]
test-support = []

# Desktops only: Velopack packages Windows, macOS and Linux apps, and a phone's store installs
# and updates the app. On iOS and Android the crate builds empty.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
corundum-framework-platform = { version = "0.4.0", path = "../corundum-framework-platform", default-features = false }
corundum-framework-update = { version = "0.4.0", path = "../corundum-framework-update", default-features = false }
semver = "1"
thiserror.workspace = true
tracing.workspace = true
url = "2"
velopack = "1.2.161"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
