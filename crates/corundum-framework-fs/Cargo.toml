[package]
name = "corundum-framework-fs"
# Versioned with the other corundum-framework crates (release-plz's `corundum` group).
version = "0.11.0"
edition.workspace = true
description = "An app server's workspace folder over the fs.* and journal.* methods: checked paths, the app's files hidden, folders listed a page at a time, files read in ranges, and moves, new folders and trashing as undoable batches"
license = "MIT OR Apache-2.0"
repository.workspace = true
readme = "README.md"
keywords = ["json-rpc", "filesystem", "workspace", "server"]
categories = ["filesystem"]

[dependencies]
base64 = "0.23"
blake3 = "1"
cap-fs-ext = "4"
cap-std = "4"
corundum-framework-fs-api = { version = "0.11.0", path = "../corundum-framework-fs-api" }
corundum-framework-journal = { version = "0.11.0", path = "../corundum-framework-journal" }
grain-id = "0.15"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true


[target.'cfg(unix)'.dependencies]
# O_NONBLOCK, so opening a swapped-in FIFO does not block; mkfifo in the tests.
libc = "0.2"
# renameat2 / renameatx_np with no-replace, for moves that never replace an entry.
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# SetFileInformationByHandle(FileRenameInfo), for a rename that never replaces an entry.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
