[package]
name = "corundum-framework-gui"
# Versioned on its own, not with sapphire-framework: asteria uses it too, and should not see a
# new version with every sapphire release.
version = "0.1.0"
edition.workspace = true
description = "The look shared by sapphire and asteria apps: egui shell, system fonts, Lucide icons, translations"
license = "MIT OR Apache-2.0"
repository.workspace = true
readme.workspace = true
keywords = ["gui", "egui", "icons", "fonts", "i18n"]
categories = ["gui"]

# The components render inside a host app's egui context, on the desktops and on phones
# alike. All consuming apps must use the same egui major version.
#
# `eframe` (default) adds the window: `window::run` opens a desktop window on wgpu, set up
# by `gpu`. Turn default features off for an app that renders egui without eframe.
#
# `android` is the window on an Android phone (`window::run_android`, GameActivity), with
# the platform calls and logcat behind it. eframe's default does not build on Android
# (winit needs an activity chosen), so an Android app turns this on.
[features]
default = ["eframe"]
eframe = ["dep:eframe", "dep:objc2", "dep:objc2-ui-kit", "dep:raw-window-handle"]
android = [
    "eframe",
    "eframe/android-game-activity",
    "dep:android-activity",
    "dep:android_log-sys",
    "dep:tracing-subscriber",
]
# Serialize / Deserialize on the theme and language settings, for the app to save them.
serde = ["dep:serde", "egui/serde"]

[dependencies]
# The system's languages, and the clipboard and insets on Android: the JNI lives there.
corundum-framework-platform = { version = "0.1.0", path = "../corundum-framework-platform" }
# eframe's default features, less `wayland`: since 0.37 it turns on arboard's Wayland
# clipboard, which arboard pulls in on iOS too and which does not build there. The other
# targets get the full default from the entry below.
eframe = { version = "0.37", optional = true, default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
    "wgpu",
] }
egui = "0.37"
# The SVG loader for the bundled Lucide icons (assets/icons), and for the apps' own.
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
# The translations (i18n): Fluent messages, and matching the user's languages to them.
fluent-bundle = "0.16"
fluent-langneg = "0.14"
# The parsed files' entries, for i18n::check (already a dependency of fluent-bundle).
fluent-syntax = "0.12"
fontdb = "0.24"
ttf-parser = "0.25"
tracing.workspace = true
serde = { workspace = true, optional = true }
unic-langid = "0.9"

[dev-dependencies]
serde_json.workspace = true

# eframe's full default (with `wayland`) everywhere but iOS; see the entry above.
[target.'cfg(not(target_os = "ios"))'.dependencies]
eframe = { version = "0.37", optional = true }

# iOS's sandbox refuses to list the system font directories, so the font files are found
# through CoreText instead (fonts::apple).
[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFSet", "CFString", "CFURL"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFontDescriptor", "CTFontCollection"] }
# The `eframe` feature's: the window drawn over the whole screen, with egui told the safe
# area (window::ios), as eframe 0.37 stretches its surface there.
objc2 = { version = "0.6.4", optional = true }
objc2-ui-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "UIGeometry", "UIResponder", "UIView", "UIWindow"] }
raw-window-handle = { version = "0.6", optional = true }

# The `android` feature's: the activity and logcat. The JNI calls are
# corundum-framework-platform's.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", optional = true }
android_log-sys = { version = "0.3", optional = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"], optional = true }
