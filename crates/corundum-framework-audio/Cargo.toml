[package]
name = "corundum-framework-audio"
# Versioned with the other corundum-framework crates (release-plz's `corundum` group).
version = "0.10.0"
edition.workspace = true
description = "Decode and resample audio files without a GUI: FLAC, MP3, AAC, ALAC, Vorbis, WAV and Ogg Opus, with seeking, tags and length"
license = "MIT OR Apache-2.0"
repository.workspace = true
readme = "README.md"
keywords = ["audio", "decode", "symphonia", "opus", "resample"]
categories = ["multimedia::audio"]

[features]
default = []
# The real sound device: cpal's default output, through a ring buffer.
cpal = ["dep:cpal", "dep:rtrb"]
# The fakes of the device and the opener, for tests.
test-support = []

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "pcm", "wav", "id3v1", "id3v2", "ape"] }
ogg = "0.9.2"
opus-pure = { version = "0.2.2", default-features = false }
rubato = "5.0.1"
cpal = { version = "0.18.2", optional = true }
rtrb = { version = "0.3", optional = true }
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
corundum-framework-audio = { path = ".", features = ["test-support"] }
