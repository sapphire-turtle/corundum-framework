[package]
name = "corundum-framework-update"
# Versioned with the other corundum-framework crates (release-plz's `corundum` group).
version = "0.11.1"
edition.workspace = true
description = "Find newer GitHub releases of an app's binary, and replace it with one"
license = "MIT OR Apache-2.0"
repository.workspace = true
readme.workspace = true
keywords = ["update", "self-update", "release", "github"]
categories = ["command-line-utilities"]

# `self-update` (default) is everything that downloads, verifies and replaces: without it the
# crate only looks up releases and words advice, and `self-replace` is not linked. `cli` is the `update`
# subcommand (`UpdateArgs`, `run`), for a binary that has a command line.
[features]
default = ["self-update"]
self-update = ["dep:self-replace", "dep:tempfile", "dep:minisign-verify", "dep:base64", "dep:sha2"]
cli = ["dep:clap"]

[dependencies]
base64 = { version = "0.22", optional = true }
clap = { workspace = true, optional = true }
corundum-framework-platform = { version = "0.11.1", path = "../corundum-framework-platform", default-features = false }
minisign-verify = { version = "0.2", optional = true }
reqwest.workspace = true
self-replace = { version = "1.5", optional = true }
sha2 = { version = "0.11", optional = true }
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
tempfile = { version = "3", optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
minisign = "0.7"
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx"] }
