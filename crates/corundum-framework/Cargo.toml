[package]
name = "corundum-framework"
# Versioned on its own, as the crates under it are.
version = "0.3.0"
edition.workspace = true
description = "The application framework shared by sapphire and asteria apps - single-dependency facade over the corundum-framework-* crates"
license = "MIT OR Apache-2.0"
repository.workspace = true
readme.workspace = true
keywords = ["gui", "egui", "dirs", "android", "ios"]
categories = ["gui", "os"]

# Facade crate, as sapphire-framework is: depend on this one crate and turn on features for
# the pieces you need. Each feature exposes a member crate as a module
# (`corundum_framework::gui`, `::platform`); the member crates stay split so that the ones
# without a window never build egui.
#
# The default is the part without egui, as sapphire-framework's default is its workspace
# without the gui: a server or a CLI takes the default, an app turns on `gui` (with `eframe`
# for the desktop window, or `android` for the phone's).
[features]
default = ["platform"]

# ── modules ──────────────────────────────────────────────────────────────────
platform = ["dep:corundum-framework-platform"]
# The components alone, for an app that renders egui without eframe. corundum-framework-gui
# is built on corundum-framework-platform, so `gui` brings `platform` along.
gui = ["dep:corundum-framework-gui", "platform"]
# Release lookup and advice (where a newer release is), without egui or a window: for an
# app, or its server.
update = ["dep:corundum-framework-update"]
# The download and the replacement too. A store build leaves it off, as the store updates.
self-update = ["update", "corundum-framework-update/self-update"]

# ── gui passthrough ──────────────────────────────────────────────────────────
# `gui::window::run`: a desktop window on eframe + wgpu, started the same way for every app.
eframe = ["gui", "corundum-framework-gui/eframe"]
# `gui::window::run_android`: the window on an Android phone (GameActivity), with logcat.
# The phone's window is eframe's too, so `android` brings `eframe` (and `::eframe`) along;
# the gui crate's `android` already turns on its own `eframe`, so nothing more is built.
android = ["eframe", "corundum-framework-gui/android"]
# Serialize / Deserialize on the gui's theme and language settings, and `gui::store`, the look
# in effect and the rail's order kept on the device (applies when `gui` is on).
serde = ["corundum-framework-gui?/serde"]
# `gui::update`: the Settings → About update panel's states (applies when `gui` is on).
gui-update = ["gui", "update", "corundum-framework-gui/update"]
# ... with the download and the replacement.
gui-self-update = ["gui-update", "self-update", "corundum-framework-gui/self-update"]
# `gui::platform::MediaPicker`: photos and videos from the phone's album, the file dialog on
# a desktop. On Android the app's activity must forward its result
# (`platform::media::available` has the code); iOS needs no Info.plist key.
media-picker = ["gui", "corundum-framework-gui/media-picker"]

[dependencies]
corundum-framework-platform = { version = "0.3.0", path = "../corundum-framework-platform", optional = true }
# Without eframe unless asked for: eframe's default window does not build on Android.
corundum-framework-gui = { version = "0.3.0", path = "../corundum-framework-gui", optional = true, default-features = false }
# Without its default `self-update`, which the facade's `self-update` feature turns on: the
# lookup and the advice, so a store build does not link the replacement.
corundum-framework-update = { version = "0.3.0", path = "../corundum-framework-update", optional = true, default-features = false }
