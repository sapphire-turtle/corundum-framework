[package]
name = "corundum-framework-platform"
# Versioned on its own, as corundum-framework-gui is.
version = "0.3.0"
edition.workspace = true
description = "What sapphire and asteria apps ask of the OS, without egui: app directories (phones included), the system's languages, the JNI / Objective-C bridging"
license = "MIT OR Apache-2.0"
repository.workspace = true
readme.workspace = true
keywords = ["dirs", "locale", "android", "ios", "jni"]
categories = ["os"]

# No egui here: the crates without a window (workspace, server, bridge, CLI) need the
# directories too. corundum-framework-gui builds on this one.
#
# The system's screens an app opens (pickers, scanners) are off by default: each asks the
# app for declarations of its own and, on iOS, links a framework App Store review looks at.
#
# `media-picker` is `media`, the phone's photo picker: PhotosUI on iOS (no Info.plist key);
# on Android the Photo Picker or ACTION_GET_CONTENT (no permission), whose result the app's
# activity must forward (`media::available` has the code).
#
# `qr-scan` is `qr`, the phone's QR code scanner: AVFoundation's camera on iOS, which needs
# NSCameraUsageDescription and is linked only with this feature; on Android Google's code
# scanner, which needs the app's play-services-code-scanner dependency and no permission
# (`qr::available` has both).
[features]
media-picker = [
    "dep:block2",
    "dep:objc2",
    "dep:objc2-photos-ui",
    "dep:objc2-ui-kit",
    "objc2-foundation/block2",
    "objc2-foundation/NSError",
    "objc2-foundation/NSEnumerator",
    "objc2-foundation/NSItemProvider",
    "objc2-foundation/NSProgress",
    "objc2-foundation/NSSet",
]
qr-scan = [
    "dep:dispatch2",
    "dep:objc2",
    "dep:objc2-av-foundation",
    "dep:objc2-core-foundation",
    "dep:objc2-quartz-core",
    "dep:objc2-ui-kit",
    "objc2-foundation/NSBundle",
    "objc2-foundation/NSEnumerator",
    "objc2-foundation/NSError",
    "objc2-foundation/NSSet",
    "objc2-ui-kit?/objc2-core-foundation",
    "objc2-ui-kit?/objc2-quartz-core",
    "objc2-ui-kit?/UIButton",
    "objc2-ui-kit?/UIColor",
    "objc2-ui-kit?/UIControl",
    "objc2-ui-kit?/UIGeometry",
    "objc2-ui-kit?/UIImage",
]

[dependencies]
dirs = "7"
sys-locale = "0.3"
tracing.workspace = true
unic-langid = "0.9"

# Desktop icons: an SVG rendered to PNG, icns and ico. No text feature: icons carry no text.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
resvg = { version = "0.45", default-features = false }

# iOS: the sandbox's directories, from NSFileManager rather than $HOME.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSFileManager", "NSPathUtilities", "NSString", "NSURL"] }
# `media-picker`: PHPickerViewController, presented over the window's root view controller,
# and the files it hands over, copied in a block before they go.
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-photos-ui = { version = "0.3.2", optional = true, default-features = false, features = ["std", "PHPicker"] }
objc2-ui-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "block2",
    "UIApplication",
    "UIResponder",
    "UIScene",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }
# `qr-scan`: a capture session whose metadata output reads QR codes, its preview layer in a
# full-screen view controller. AVFoundation is linked only with this feature, as App Store
# review asks an app that links the camera's API for NSCameraUsageDescription.
dispatch2 = { version = "0.3", optional = true }
objc2-av-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "AVAnimation",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureMetadataOutput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureVideoPreviewLayer",
    "AVMediaFormat",
    "AVMetadataObject",
] }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CFCGTypes"] }
objc2-quartz-core = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "CALayer"] }

# Android: the language list, the directories, the clipboard and the insets, read from the
# JVM through the context android-activity (or any host) leaves in ndk-context.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

# Windows: the Start Menu shortcut, written through the shell's COM objects.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[dev-dependencies]
tempfile = "3"
