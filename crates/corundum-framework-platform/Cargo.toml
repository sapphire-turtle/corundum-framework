[package]
name = "corundum-framework-platform"
# Versioned on its own, as corundum-framework-gui is.
version = "0.3.0"
edition.workspace = true
description = "What sapphire and asteria apps ask of the OS, without egui: app directories (phones included), the system's languages, the JNI / Objective-C bridging"
license = "MIT OR Apache-2.0"
repository.workspace = true
readme.workspace = true
keywords = ["dirs", "locale", "android", "ios", "jni"]
categories = ["os"]

# `media-session`: the OS's media keys and its "now playing" (`media_session`), a music
# player's. Off by default: it pulls in D-Bus (zbus) on Linux and Apple's MediaPlayer, and
# on a phone it asks the OS for more than a window (background audio on iOS), which an app
# turns on knowingly.
[features]
media-session = [
    "dep:raw-window-handle",
    "dep:zbus",
    "windows/Foundation",
    "windows/Media",
    "windows/Storage_Streams",
    "windows/Win32_System_WinRT",
    "dep:block2",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-avf-audio",
    "dep:objc2-core-foundation",
    "dep:objc2-foundation",
    "dep:objc2-media-player",
    "dep:objc2-ui-kit",
    "objc2-foundation/NSData",
    "objc2-foundation/NSDictionary",
    "objc2-foundation/NSNotification",
    "objc2-foundation/NSOperation",
    "objc2-foundation/NSValue",
    "objc2-foundation/block2",
]

# No egui here: the crates without a window (workspace, server, bridge, CLI) need the
# directories too. corundum-framework-gui builds on this one.
[dependencies]
dirs = "7"
# `media-session`: the window a session is for (Windows asks for its HWND).
raw-window-handle = { version = "0.6", optional = true }
sys-locale = "0.3"
tracing.workspace = true
unic-langid = "0.9"

# Desktop icons: an SVG rendered to PNG, icns and ico. No text feature: icons carry no text.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
resvg = { version = "0.45", default-features = false }

# iOS: the sandbox's directories, from NSFileManager rather than $HOME.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSFileManager", "NSPathUtilities", "NSString", "NSURL"] }
# `media-session`: the cover as a UIImage, and the audio session that makes the app the one
# playing (its category, the calls that interrupt it, the headphones pulled out).
objc2-avf-audio = { version = "0.3.2", optional = true, default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }
objc2-ui-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "UIImage"] }

# macOS: `media-session`'s cover, as an NSImage.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "NSImage"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSString"] }

# macOS and iOS: `media-session`'s "now playing" and the remote commands (MediaPlayer).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CFCGTypes"] }
objc2-media-player = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }

# Android: the language list, the directories, the clipboard and the insets, read from the
# JVM through the context android-activity (or any host) leaves in ndk-context.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

# Linux and the BSDs: `media-session` as an MPRIS player on the session bus. zbus speaks
# D-Bus itself, so no libdbus is linked; these are the features eframe's screen reader
# support (accesskit) already builds zbus with, so a windowed app builds it once.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus = { version = "5.19", optional = true, default-features = false, features = ["async-io"] }

# Windows: the Start Menu shortcut, written through the shell's COM objects; with
# `media-session`, the window's media controls (SystemMediaTransportControls).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[dev-dependencies]
tempfile = "3"
