[package]
name = "corundum-framework-platform"
# Versioned on its own, as corundum-framework-gui is.
version = "0.3.0"
edition.workspace = true
description = "What sapphire and asteria apps ask of the OS, without egui: app directories (phones included), the system's languages, the JNI / Objective-C bridging"
license = "MIT OR Apache-2.0"
repository.workspace = true
readme.workspace = true
keywords = ["dirs", "locale", "android", "ios", "jni"]
categories = ["os"]

# No egui here: the crates without a window (workspace, server, bridge, CLI) need the
# directories too. corundum-framework-gui builds on this one.
#
# The system's screens an app opens (pickers, scanners) are off by default: each asks the
# app for declarations of its own and, on iOS, links a framework App Store review looks at.
#
# `media-picker` is `media`, the phone's photo picker: PhotosUI on iOS (no Info.plist key);
# on Android the Photo Picker or ACTION_GET_CONTENT (no permission), whose result the app's
# activity must forward (`media::available` has the code).
#
# `qr-scan` is `qr`, the phone's QR code scanner: AVFoundation's camera on iOS, which needs
# NSCameraUsageDescription and is linked only with this feature; on Android Google's code
# scanner, which needs the app's play-services-code-scanner dependency and no permission
# (`qr::available` has both).
#
# `media-session`: the OS's media keys and its "now playing" (`media_session`), a music
# player's. Off by default: it pulls in D-Bus (zbus) on Linux and Apple's MediaPlayer, and
# on a phone it asks the OS for more than a window (background audio on iOS), which an app
# turns on knowingly.
#
# `icon` and `launcher` are on by default and a headless user turns them off: `icon`
# renders an SVG (resvg) and `launcher` writes the app menu entry, on Windows through the
# shell's COM objects (the `windows` crate's Shell features). `launcher` needs `icon` (the
# macOS bundle's icns). `dirs`, `locale` and `package` are always there.
[features]
default = ["icon", "launcher"]
icon = ["dep:resvg"]
launcher = [
    "icon",
    "windows/Win32_Foundation",
    "windows/Win32_Storage_EnhancedStorage",
    "windows/Win32_Storage_FileSystem",
    "windows/Win32_System_Com",
    "windows/Win32_System_Com_StructuredStorage",
    "windows/Win32_System_Variant",
    "windows/Win32_UI_Shell",
    "windows/Win32_UI_Shell_PropertiesSystem",
]
media-session = [
    "windows/Win32_Foundation",
    "dep:raw-window-handle",
    "dep:zbus",
    "windows/Foundation",
    "windows/Media",
    "windows/Storage_Streams",
    "windows/Win32_System_WinRT",
    "dep:block2",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-avf-audio",
    "dep:objc2-core-foundation",
    "dep:objc2-foundation",
    "dep:objc2-media-player",
    "dep:objc2-ui-kit",
    "objc2-foundation/NSData",
    "objc2-foundation/NSDictionary",
    "objc2-foundation/NSNotification",
    "objc2-foundation/NSOperation",
    "objc2-foundation/NSValue",
    "objc2-foundation/block2",
]
media-picker = [
    "dep:block2",
    "dep:objc2",
    "dep:objc2-photos-ui",
    "dep:objc2-ui-kit",
    "objc2-foundation/block2",
    "objc2-foundation/NSError",
    "objc2-foundation/NSEnumerator",
    "objc2-foundation/NSItemProvider",
    "objc2-foundation/NSProgress",
    "objc2-foundation/NSSet",
]
qr-scan = [
    "dep:dispatch2",
    "dep:objc2",
    "dep:objc2-av-foundation",
    "dep:objc2-core-foundation",
    "dep:objc2-quartz-core",
    "dep:objc2-ui-kit",
    "objc2-foundation/NSBundle",
    "objc2-foundation/NSEnumerator",
    "objc2-foundation/NSError",
    "objc2-foundation/NSSet",
    "objc2-ui-kit?/objc2-core-foundation",
    "objc2-ui-kit?/objc2-quartz-core",
    "objc2-ui-kit?/UIButton",
    "objc2-ui-kit?/UIColor",
    "objc2-ui-kit?/UIControl",
    "objc2-ui-kit?/UIGeometry",
    "objc2-ui-kit?/UIImage",
]

[dependencies]
dirs = "7"
# `media-session`: the window a session is for (Windows asks for its HWND).
raw-window-handle = { version = "0.6", optional = true }
sys-locale = "0.3"
tracing.workspace = true
unic-langid = "0.9"

# Desktop icons: an SVG rendered to PNG, icns and ico. No text feature: icons carry no text.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
resvg = { version = "0.45", optional = true, default-features = false }

# iOS: the sandbox's directories, from NSFileManager rather than $HOME.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSFileManager", "NSPathUtilities", "NSString", "NSURL"] }
# `media-picker`: PHPickerViewController, presented over the window's root view controller,
# and the files it hands over, copied in a block before they go. `media-session`: the cover
# as a UIImage.
objc2-photos-ui = { version = "0.3.2", optional = true, default-features = false, features = ["std", "PHPicker"] }
objc2-ui-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "UIApplication",
    "UIImage",
    "UIResponder",
    "UIScene",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }
# `qr-scan`: a capture session whose metadata output reads QR codes, its preview layer in a
# full-screen view controller. AVFoundation is linked only with this feature, as App Store
# review asks an app that links the camera's API for NSCameraUsageDescription.
dispatch2 = { version = "0.3", optional = true }
objc2-av-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "AVAnimation",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureMetadataOutput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureVideoPreviewLayer",
    "AVMediaFormat",
    "AVMetadataObject",
] }
objc2-quartz-core = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "CALayer"] }
# `media-session`: the audio session that makes the app the one playing (its category, the
# calls that interrupt it, the headphones pulled out).
objc2-avf-audio = { version = "0.3.2", optional = true, default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }

# macOS: `media-session`'s cover, as an NSImage.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "NSImage"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSString"] }

# macOS and iOS: the Objective-C runtime and blocks (the pickers and scanner on iOS, the
# media session on both), and `media-session`'s "now playing" and remote commands
# (MediaPlayer).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CFCGTypes"] }
objc2-media-player = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }

# Android: the language list, the directories, the clipboard and the insets, read from the
# JVM through the context android-activity (or any host) leaves in ndk-context.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

# Linux and the BSDs: `media-session` as an MPRIS player on the session bus. zbus speaks
# D-Bus itself, so no libdbus is linked; these are the features eframe's screen reader
# support (accesskit) already builds zbus with, so a windowed app builds it once.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus = { version = "5.19", optional = true, default-features = false, features = ["async-io"] }

# Windows: always the file calls `dirs` moves an app's data with (`MoveFileExW`, which never
# replaces a file); `launcher`'s Start Menu shortcut, written through the shell's COM
# objects, and with `media-session` the window's media controls (SystemMediaTransportControls),
# add the features listed under [features]. A headless build gets the file calls alone.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
